<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ — 원문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
  // Apply the app's selected theme (localStorage 'pr-theme'; same origin as the
  // gallery) so the original pane matches the chosen theme, not just OS dark/light.
  (function () {
    const T = {
      light:  {bg:"#ffffff", fg:"#1d1d1f", muted:"#7a7a7a", accent:"#0066cc", border:"#e0e0e0", surface:"#f5f5f7"},
      dark:   {bg:"#161618", fg:"#e6e6e6", muted:"#8a8f98", accent:"#6cb6ff", border:"#33343a", surface:"#1f2023"},
      stripe: {bg:"#ffffff", fg:"#0a0e27", muted:"#6b7280", accent:"#635bff", border:"#e5e7eb", surface:"#f6f8fb"},
      figma:  {bg:"#ffffff", fg:"#0d0d0d", muted:"#666666", accent:"#18a0fb", border:"#ebebeb", surface:"#f8f8f8"},
      tesla:  {bg:"#000000", fg:"#ffffff", muted:"#8a8a8a", accent:"#e82127", border:"#2a2a2a", surface:"#0d0d0d"},
      sunset: {bg:"#1a1412", fg:"#fbeee6", muted:"#b08e7e", accent:"#ff7a59", border:"#3d2f28", surface:"#241b18"},
      sage:   {bg:"#f6f8f4", fg:"#1f2a1c", muted:"#6b7a5e", accent:"#2f7d4f", border:"#d7e0cf", surface:"#eef2ea"},
    };
    let t = "light";
    try { t = localStorage.getItem("pr-theme") || "auto"; } catch (e) {}
    if (t === "auto" || !T[t]) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    const v = T[t] || T.light, r = document.documentElement.style;
    for (const k in v) r.setProperty("--" + k, v[k]);
  })();
</script>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#7a7a7a; --accent:#0066cc; --border:#e0e0e0; --surface:#f5f5f7; }
  body {
    margin: 0; padding: 2rem 2.2rem 4rem;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", "Segoe UI", Roboto, sans-serif;
    line-height: 1.7; font-size: 15px;
    color: var(--fg); background: var(--bg);
    max-width: 820px; margin-inline: auto;
    -webkit-font-smoothing: antialiased;
    --img-outline: color-mix(in srgb, var(--fg) 12%, transparent);
  }
  a { color: var(--accent); }
  hr { border: none; border-top: 1px solid var(--border); }
  h1 { font-size: 1.7rem; line-height: 1.3; text-wrap: balance; }
  h2 { font-size: 1.3rem; margin-top: 2rem; border-bottom: 1px solid var(--border); padding-bottom: .25rem; text-wrap: balance; }
  h3 { font-size: 1.1rem; margin-top: 1.5rem; text-wrap: balance; }
  p, li { text-wrap: pretty; }
  img { max-width: 100%; height: auto; outline: 1px solid var(--img-outline); outline-offset: -1px; }
  pre { overflow-x: auto; padding: .8rem; background: var(--surface); border-radius: 6px; }
  code { padding: .1em .35em; border-radius: 4px; background: var(--surface); }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid var(--border); padding: .4rem .6rem; }
  .src-badge {
    display: inline-block; font-size: .72rem; letter-spacing: .03em;
    text-transform: uppercase; background: var(--surface); color: var(--muted);
    padding: .15rem .5rem; border-radius: 999px; margin-bottom: 1rem;
  }
  .figs { margin-top: 2.5rem; }
  .figs h2 { border: none; }
  figure { margin: 1.5rem 0; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  figcaption { font-size: .85rem; color: var(--muted); margin-top: .5rem; }
</style>
</head>
<body data-slug="__SLUG__">
  <span class="src-badge">원문 (original)</span>
  <article id="content">불러오는 중…</article>
  <section class="figs" id="figs" hidden>
    <h2>그림 / 다이어그램</h2>
    <div id="figs-list"></div>
  </section>
<script>
  const slug = document.body.dataset.slug;
  async function load() {
    const md = await fetch(`/paper/${slug}/source.md`).then(r => r.ok ? r.text() : "");
    const el = document.getElementById("content");
    el.innerHTML = md ? marked.parse(md) : "<p>원문 텍스트가 없습니다.</p>";
    try {
      renderMathInElement(el, {
        delimiters: [
          {left: "$$", right: "$$", display: true},
          {left: "$", right: "$", display: false},
        ],
        throwOnError: false,
      });
    } catch (e) {}
    loadFigures();
  }
  const norm = s => (s || "").toLowerCase().replace(/\s+/g, " ").trim();
  function makeFigure(f) {
    const fig = document.createElement("figure");
    if (f.data_uri) {
      const img = document.createElement("img");
      img.src = f.data_uri; img.alt = f.caption_en || f.label || "";
      fig.appendChild(img);
    } else if (f.html) {
      const div = document.createElement("div");
      div.innerHTML = f.html; fig.appendChild(div);
    }
    const cap = f.caption_en || f.label;
    if (cap) {
      const c = document.createElement("figcaption");
      c.textContent = cap; fig.appendChild(c);
    }
    return fig;
  }
  async function loadFigures() {
    let figs = [];
    try { figs = await fetch(`/paper/${slug}/figures.json`).then(r => r.ok ? r.json() : []); }
    catch (e) { return; }
    if (!Array.isArray(figs)) figs = figs.figures || [];
    if (!figs.length) return;

    // Map each content heading (normalized text) → its element. Place each
    // figure right after the heading of the section it came from; figures with
    // no section_heading (or no match) fall back to the bottom gallery.
    const content = document.getElementById("content");
    const headings = [...content.querySelectorAll("h1,h2,h3,h4")];
    const byText = {};
    for (const h of headings) { const k = norm(h.textContent); if (!(k in byText)) byText[k] = h; }
    const anchor = {};  // heading text → last inserted node (to keep figure order)
    const leftover = [];
    for (const f of figs) {
      const key = norm(f.section_heading);
      const h = key && byText[key];
      if (h) {
        const fig = makeFigure(f);
        (anchor[key] || h).insertAdjacentElement("afterend", fig);
        anchor[key] = fig;
      } else {
        leftover.push(f);
      }
    }
    if (leftover.length) {
      const wrap = document.getElementById("figs-list");
      leftover.forEach(f => wrap.appendChild(makeFigure(f)));
      document.getElementById("figs").hidden = false;
    }
  }
  load();
</script>
</body>
</html>
