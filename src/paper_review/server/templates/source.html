<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ — 원문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 2rem 2.2rem 4rem;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", "Segoe UI", Roboto, sans-serif;
    line-height: 1.7; font-size: 15px;
    color: #1d1d1f; background: #fff;
    max-width: 820px; margin-inline: auto;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e6e6e6; background: #161618; }
    a { color: #6cb6ff; }
    hr { border-color: #333; }
    code { background: #222; }
    .src-badge { background: #222; color: #aaa; }
    figure { border-color: #2a2a2d; }
  }
  h1 { font-size: 1.7rem; line-height: 1.3; }
  h2 { font-size: 1.3rem; margin-top: 2rem; border-bottom: 1px solid rgba(128,128,128,.25); padding-bottom: .25rem; }
  h3 { font-size: 1.1rem; margin-top: 1.5rem; }
  img { max-width: 100%; height: auto; }
  pre { overflow-x: auto; padding: .8rem; background: rgba(128,128,128,.12); border-radius: 6px; }
  code { padding: .1em .35em; border-radius: 4px; background: rgba(128,128,128,.15); }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid rgba(128,128,128,.3); padding: .4rem .6rem; }
  .src-badge {
    display: inline-block; font-size: .72rem; letter-spacing: .03em;
    text-transform: uppercase; background: #f0f0f2; color: #666;
    padding: .15rem .5rem; border-radius: 999px; margin-bottom: 1rem;
  }
  .figs { margin-top: 2.5rem; }
  .figs h2 { border: none; }
  figure { margin: 1.5rem 0; padding: 1rem; border: 1px solid #e5e5e7; border-radius: 8px; }
  figcaption { font-size: .85rem; color: #888; margin-top: .5rem; }
</style>
</head>
<body data-slug="__SLUG__">
  <span class="src-badge">원문 (original)</span>
  <article id="content">불러오는 중…</article>
  <section class="figs" id="figs" hidden>
    <h2>그림 / 다이어그램</h2>
    <div id="figs-list"></div>
  </section>
<script>
  const slug = document.body.dataset.slug;
  async function load() {
    const md = await fetch(`/paper/${slug}/source.md`).then(r => r.ok ? r.text() : "");
    const el = document.getElementById("content");
    el.innerHTML = md ? marked.parse(md) : "<p>원문 텍스트가 없습니다.</p>";
    try {
      renderMathInElement(el, {
        delimiters: [
          {left: "$$", right: "$$", display: true},
          {left: "$", right: "$", display: false},
        ],
        throwOnError: false,
      });
    } catch (e) {}
    loadFigures();
  }
  async function loadFigures() {
    let figs = [];
    try { figs = await fetch(`/paper/${slug}/figures.json`).then(r => r.ok ? r.json() : []); }
    catch (e) { return; }
    if (!Array.isArray(figs)) figs = figs.figures || [];
    if (!figs.length) return;
    const wrap = document.getElementById("figs-list");
    for (const f of figs) {
      const fig = document.createElement("figure");
      if (f.data_uri) {
        const img = document.createElement("img");
        img.src = f.data_uri; img.alt = f.caption_en || f.label || "";
        fig.appendChild(img);
      } else if (f.html) {
        const div = document.createElement("div");
        div.innerHTML = f.html; fig.appendChild(div);
      }
      const cap = f.caption_en || f.label;
      if (cap) {
        const c = document.createElement("figcaption");
        c.textContent = cap; fig.appendChild(c);
      }
      wrap.appendChild(fig);
    }
    document.getElementById("figs").hidden = false;
  }
  load();
</script>
</body>
</html>
