<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>__TITLE__ · paper-review</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- html2canvas: rasterize tables to images at insert time (markdown tables break on Velog) -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<!-- mermaid: render ```mermaid pipeline diagrams in the workbench -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<!-- gif.js: export the animated pipeline as a GIF for Obsidian/Velog publish -->
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/theme/toastui-editor-dark.min.css">
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<!-- color-syntax plugin (text color picker in the WYSIWYG toolbar) -->
<link rel="stylesheet" href="https://uicdn.toast.com/tui-color-picker/latest/tui-color-picker.min.css">
<link rel="stylesheet" href="https://uicdn.toast.com/editor-plugin-color-syntax/latest/toastui-editor-plugin-color-syntax.min.css">
<script src="https://uicdn.toast.com/tui-color-picker/latest/tui-color-picker.min.js"></script>
<script src="https://uicdn.toast.com/editor-plugin-color-syntax/latest/toastui-editor-plugin-color-syntax.min.js"></script>
<link rel="stylesheet" href="/static/detail.css">
</head>
<body data-slug="__SLUG__" data-pdf-name="__PDF_NAME__" data-has-pdf="__HAS_PDF__" data-has-viewer="__HAS_VIEWER__" data-content-type="__CONTENT_TYPE__" data-status="__STATUS__" data-rating="__RATING__">
  <div class="topbar">
    <a href="/" class="back" title="목록으로">←</a>
    <span class="title">__TITLE__</span>
    <span class="status s-__STATUS__">__STATUS__</span>
    <span class="rating" id="rating" title="별점 — 클릭하여 평가, 같은 별 다시 클릭 시 해제"></span>
    <span class="spacer"></span>

    <select id="model-picker" title="모델 선택">
      <option value="claude-opus-4-8">Opus 4.8</option>
      <option value="claude-opus-4-7">Opus 4.7</option>
      <option value="sonnet">Sonnet 4.6</option>
      <option value="haiku">Haiku 4.5</option>
    </select>

    <span class="topbar-div"></span>

    <div class="view-toggle" id="view-toggle" title="Summary / Detail view">
      <button data-view="summary">Summary</button>
      <button data-view="detail" class="active">Detail</button>
    </div>
    <div class="view-toggle pane-toggle" id="pane-toggle" title="Show / hide panes — Source PDF · Review">
      <button data-pane="pdf" title="Source PDF" aria-label="Source PDF">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
      </button>
      <button data-pane="wb" title="Review" aria-label="Review">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="7" x2="19" y2="7"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="5" y1="17" x2="13" y2="17"/></svg>
      </button>
    </div>

    <span class="topbar-div"></span>

    <button class="btn" id="btn-analyze" title="Analyze incomplete sections">Analyze</button>
    <button class="btn" id="btn-edit" title="Edit markdown">Edit</button>
    <button class="btn btn-primary" id="btn-publish" title="Export as Velog draft">Publish</button>

    <span class="topbar-div"></span>

    <button class="iconbtn" id="btn-figures" title="Figures (G)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-4.5-4.5L4 21"/></svg>
      <span class="count" id="figs-count">·</span>
    </button>
    <button class="iconbtn" id="btn-bookmark" title="책갈피 — 클릭: 이동 · ⌥+클릭: 현재 위치 저장 · ⇧+클릭: 삭제">
      <svg class="bm-ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
    </button>
    <button class="iconbtn" id="btn-pdf" title="PDF로 내보내기 (인쇄 → PDF로 저장)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11m0 0l-4-4m4 4l4-4"/><path d="M5 21h14"/></svg>
    </button>
    <button class="iconbtn" id="btn-chat" title="Chat (C)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5z"/></svg>
    </button>
  </div>

  <main class="layout" id="layout">
    <button class="nav-reopen" id="nav-reopen" title="Show sections (S)">☰</button>
    <aside class="nav" id="nav">
      <div class="nav-header">
        <span>Sections</span>
        <button class="nav-collapse" id="nav-collapse" title="Collapse (S)">‹</button>
      </div>
      <ul class="nav-list" id="nav-list"></ul>
    </aside>
    <section class="pane pdf">
      <iframe src="__SOURCE_SRC__#toolbar=0" title="원문"></iframe>
    </section>
    <div class="gutter" id="gutter" title="드래그하여 좌/우 너비 조절 · 더블클릭 초기화" role="separator" aria-orientation="vertical"></div>
    <div class="wb-stack">
      <section class="pane wb" id="wb" tabindex="0"></section>
      <aside class="chat" id="chat" data-collapsed="1">
        <div class="chat-head" id="chat-head" title="click to collapse">
          <span class="label">Chat</span>
          <span class="meta" id="chat-meta">·</span>
          <span class="spacer"></span>
          <span class="caret">▾</span>
        </div>
        <div class="chat-body" id="chat-body">
          <div class="chat-empty" id="chat-empty">
            Claude와 대화로 리뷰 진행하기.<br><br>
            <span class="kbd">Enter</span> 보내기 · <span class="kbd">Shift+Enter</span> 줄바꿈 · <span class="kbd">C</span> 채팅 토글
          </div>
        </div>
        <div class="chat-input-wrap">
          <div class="slash-row" id="slash-row">
            <button class="slash-chip" data-prompt="/status">/status</button>
            <button class="slash-chip" data-prompt="/next-section">/next-section</button>
            <button class="slash-chip" data-prompt="/explain tldr">/explain tldr</button>
            <button class="slash-chip" data-prompt="/explain contributions">/explain contributions</button>
            <button class="slash-chip" data-prompt="/explain prereqs">/explain prereqs</button>
            <button class="slash-chip" data-prompt="/finalize">/finalize</button>
          </div>
          <div class="chat-input-row">
            <textarea class="chat-input" id="chat-input" rows="1"
                      placeholder="메시지 또는 /명령. Enter 전송, Shift+Enter 줄바꿈."></textarea>
            <button class="chat-send" id="chat-send">Send</button>
          </div>
          <div class="chat-cost" id="chat-cost"></div>
        </div>
      </aside>
    </div>
  </main>

  <div class="a-toast" id="a-toast" aria-hidden="true">
    <div class="a-toast-head">
      <span class="dot"></span>
      <span class="label" id="a-toast-label">Analyzing</span>
      <span class="frac" id="a-toast-frac">·</span>
      <span class="spacer"></span>
      <button id="a-toast-fulllog" title="전체 로그">로그</button>
      <button id="a-toast-cancel" title="Cancel">✕</button>
    </div>
    <div class="a-toast-sub" id="a-toast-sub">—</div>
    <div class="a-toast-log" id="a-toast-log"></div>
    <div class="a-toast-preview" id="a-toast-preview" style="display:none"></div>
  </div>

  <div class="modal" id="modal-alog" aria-hidden="true">
    <div class="modal-bg" data-close></div>
    <div class="modal-content">
      <div class="modal-head">
        <h2>분석 로그</h2>
        <span class="hint" id="alog-status">—</span>
      </div>
      <div class="alog-failed" id="alog-failed"></div>
      <pre class="alog-body" id="alog-body">로그 없음</pre>
    </div>
  </div>


  <div class="modal" id="modal-figs" aria-hidden="true">
    <div class="modal-bg" data-close></div>
    <div class="modal-content">
      <div class="modal-head">
        <h2>Figures</h2>
        <span class="hint">click thumbnail · Esc to close</span>
        <span class="spacer"></span>
        <button class="modal-close" data-close aria-label="Close">×</button>
      </div>
      <div class="figs-grid" id="figs-grid"></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-head">
      <span id="lb-pos">—</span>
      <span class="spacer"></span>
      <button id="lb-prev" title="Previous (←)">←</button>
      <button id="lb-next" title="Next (→)">→</button>
      <button id="lb-close" title="Close (Esc)">×</button>
    </div>
    <div class="lightbox-img" id="lb-imgwrap"><img id="lb-img" alt=""></div>
    <div class="lightbox-html" id="lb-html" style="display:none"></div>
    <div class="lightbox-caption" id="lb-cap"></div>
  </div>

<script src="/static/ui-dialog.js" defer></script>
<script src="/static/detail.js" defer></script>
</body>
</html>
