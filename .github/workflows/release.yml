name: release

# Pushing a tag builds the .app and publishes it. Doing this by hand is how
# v2.7.1 once shipped a 2.4.6 build — the tag and the binary can't disagree
# when the tag is what triggers the build.
#
# workflow_dispatch runs the same build WITHOUT touching releases, so the
# pipeline can be verified without inventing a version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release for the current tag"
        type: boolean
        default: false

permissions:
  contents: write # create the release, upload the asset

jobs:
  build:
    runs-on: macos-latest # Apple Silicon runner → arm64 bundle
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: |
          uv venv
          uv pip install -e '.[dev]'

      - name: Test
        run: .venv/bin/python -m pytest -q

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(.venv/bin/python -c 'import paper_review; print(paper_review.__version__)')
          echo "tag=$tag  package=$pkg"
          [ "$tag" = "$pkg" ] || {
            echo "::error::tag $tag does not match __version__ $pkg"; exit 1; }

      - name: Build the app
        run: bash packaging/build.sh

      - name: Third-party artwork must not be bundled
        run: |
          chars="dist/paper-review.app/Contents/Frameworks/paper_review/server/static/characters"
          if ls "$chars" | grep -qE 'squirtle|venom|shinchan|calcifer|agumon|soot'; then
            echo "::error::bundle contains third-party character art"; exit 1
          fi
          echo "$(ls "$chars" | wc -l) illustrations, all original"

      - name: The bundle serves what the source serves
        run: |
          # The .app reads templates, static files, skills and assets from
          # inside the bundle. Anything the spec forgets is invisible until
          # someone opens that screen in the app — Settings → 스킬 shipped empty
          # for weeks because every check had been done against the source.
          root="$RUNNER_TEMP/lib"
          mkdir -p "$root/papers/to_read/fixture"
          printf -- '---\nslug: fixture\nstatus: to_read\ntitle_en: "Fixture"\ncontent_type: paper\n---\n\n## 섹션별 리뷰\n\n### 1 Intro\n_(미진행)_\n' \
            > "$root/papers/to_read/fixture/workbench.md"

          PAPER_REVIEWS_ROOT="$root" dist/paper-review.app/Contents/MacOS/paper-review \
            serve --host 127.0.0.1 --port 8801 &
          PAPER_REVIEWS_ROOT="$root" .venv/bin/python -m uvicorn paper_review.server.app:app \
            --host 127.0.0.1 --port 8802 --log-level warning &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8801/ >/dev/null && curl -sf http://127.0.0.1:8802/ >/dev/null && break
            sleep 1
          done
          .venv/bin/python packaging/route_parity.py http://127.0.0.1:8801 http://127.0.0.1:8802

      - uses: actions/upload-artifact@v4
        with:
          name: paper-review-arm64
          path: dist/paper-review-arm64.zip
          retention-days: 7

      - name: Should this tag be published?
        id: gate
        run: |
          # Every patch tag used to publish a Release, which put an entry in the
          # GitHub activity feed for each fix. Feature tags (vX.Y.0) publish;
          # patch tags build and keep the artifact only. workflow_dispatch can
          # force a publish.
          publish=false
          if [ "${{ inputs.publish }}" = "true" ]; then
            publish=true
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME publish=$publish"

      - name: Release notes from the CHANGELOG
        if: steps.gate.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          .venv/bin/python - "$GITHUB_REF_NAME" > NOTES.md <<'PY'
          import re, sys
          from pathlib import Path

          ver = sys.argv[1].lstrip("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          # the section for this version, up to the next "## "
          m = re.search(rf"^## {re.escape(ver)}\s*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          print((m.group(1).strip() if m else "See CHANGELOG.md."))
          PY
          cat NOTES.md

      - name: Publish
        if: steps.gate.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/paper-review-arm64.zip \
            --title "$GITHUB_REF_NAME" --notes-file NOTES.md \
            || gh release upload "$GITHUB_REF_NAME" dist/paper-review-arm64.zip --clobber
