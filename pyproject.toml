[project]
name = "paper-review"
version = "2.21.2"
description = "Local service for collaborative review of papers, blogs, and web articles (→ workbench → Velog draft)"
readme = "DESIGN.md"
requires-python = ">=3.10"
authors = [{ name = "Go-MinSeong" }]
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pillow>=10.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=2.0",
    "pypdf>=4.0",
    "pypdfium2>=4.0",
    "python-multipart>=0.0.9",
    "rumps>=0.4; sys_platform == 'darwin'",
    "pywebview>=5.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
paper-review = "paper_review.cli:main"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_review"]

[tool.hatch.build.targets.wheel.force-include]
"src/paper_review/_paper_reader/scripts" = "paper_review/_paper_reader/scripts"
"src/paper_review/_paper_reader/assets" = "paper_review/_paper_reader/assets"
"src/paper_review/_paper_reader/references" = "paper_review/_paper_reader/references"
"src/paper_review/server/templates" = "paper_review/server/templates"
"src/paper_review/server/static" = "paper_review/server/static"
"src/paper_review/server/illustration_groups.json" = "paper_review/server/illustration_groups.json"
